plugins {
    id "com.android.application"
}

def releaseStorePath = System.getenv("ANDROID_KEYSTORE_FILE")
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")

android {
    namespace "com.example.bloodmoonnightfall"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.bloodmoonnightfall"
        minSdk 24
        targetSdk 35
        versionCode 50000
        versionName "5.0.0-engine-preview"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    signingConfigs {
        release {
            if (releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            if (releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Godot keeps its imported project cache in a hidden .godot asset directory.
    // Overriding aapt's legacy ignore list makes that directory part of the APK.
    aaptOptions {
        ignoreAssetsPattern "!.svn:!.git:!.gitignore:!.ds_store:!*.scc:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

}

dependencies {
    implementation "org.godotengine:godot:4.7.1.stable"
    implementation "androidx.fragment:fragment:1.8.6"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20250517"
}
